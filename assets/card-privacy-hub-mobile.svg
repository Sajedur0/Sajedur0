<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="pphmTitle pphmDesc">
  <title id="pphmTitle">App Privacy Hub — Official Privacy Policies for Sajedur0 Apps</title>
  <desc id="pphmDesc">Dedicated web portal hosting clear, plain-language privacy policies for all Android applications published by Sajedur0. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="pphmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081722"/>
      <stop offset="100%" stop-color="#0A1124"/>
    </linearGradient>

    <linearGradient id="pphmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="pphmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pphmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#71DED2" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pphmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pphmClip)">
    <rect width="300" height="300" fill="url(#pphmBg)"/>
    <rect width="300" height="300" fill="url(#pphmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#pphmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0D2530" stroke="#71DED2" stroke-opacity="0.45" stroke-width="1.2"/>
      <path d="M 0 -13 L 11 -8.5 V 0.5 C 11 7.5 6.2 12.2 0 14.5 C -6.2 12.2 -11 7.5 -11 0.5 V -8.5 Z" fill="none" stroke="#71DED2" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M -4 0.5 L -1 3.5 L 5 -2.5" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Privacy Hub</text>
      <text x="150" y="164" fill="#71DED2" font-size="17.5" font-weight="600">App privacy portal</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(52, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#6EE7B7">Privacy</text>
        <rect x="103" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="149.5" y="23" text-anchor="middle" fill="#67E8F9">Web Hub</text>
      </g>
      <text x="150" y="272" fill="#71DED2" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#pphmBorder)" stroke-width="1.5"/>
</svg>
