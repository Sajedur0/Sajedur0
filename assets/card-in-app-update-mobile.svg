<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="iaumTitle iaumDesc">
  <title id="iaumTitle">Android In-App Update — Seamless Google Play Update Module</title>
  <desc id="iaumDesc">Integrates official Google Play flexible and immediate update flows to keep Android apps effortlessly current. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="iaumBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1128"/>
      <stop offset="100%" stop-color="#091324"/>
    </linearGradient>

    <linearGradient id="iaumBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="iaumBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A6A0EF"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="iaumAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="iaumClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iaumClip)">
    <rect width="300" height="300" fill="url(#iaumBg)"/>
    <rect width="300" height="300" fill="url(#iaumAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#iaumBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.0s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#191838" stroke="#A6A0EF" stroke-opacity="0.45" stroke-width="1.2"/>
      <path d="M -11 -3 A 11.5 11.5 0 0 1 9 -7" fill="none" stroke="#A6A0EF" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 11 3 A 11.5 11.5 0 0 1 -9 7" fill="none" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round"/>
      <polygon points="10,-10 11.5,-3.5 5,-5.5" fill="#A6A0EF"/>
      <polygon points="-10,10 -11.5,3.5 -5,5.5" fill="#C4B5FD"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">In-App Update</text>
      <text x="150" y="164" fill="#C4B5FD" font-size="17.5" font-weight="600">Play update helper</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(52, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#6EE7B7">Android</text>
        <rect x="103" y="0" width="93" height="34" rx="11" fill="#1E1B3A" stroke="#433878"/>
        <text x="149.5" y="23" text-anchor="middle" fill="#C4B5FD">Updates</text>
      </g>
      <text x="150" y="272" fill="#C4B5FD" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#iaumBorder)" stroke-width="1.5"/>
</svg>
