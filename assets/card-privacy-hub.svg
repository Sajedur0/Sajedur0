<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="pphTitle pphDesc">
  <title id="pphTitle">App Privacy Hub — Official Privacy Policies for Sajedur0 Apps</title>
  <desc id="pphDesc">Dedicated web portal hosting clear, plain-language privacy policies for all Android applications published by Sajedur0.</desc>

  <defs>
    <linearGradient id="pphBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081722"/>
      <stop offset="100%" stop-color="#0A1124"/>
    </linearGradient>

    <linearGradient id="pphBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="pphBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pphAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#71DED2" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pphClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pphClip)">
    <rect width="580" height="214" fill="url(#pphBg)"/>
    <rect width="580" height="214" fill="url(#pphAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#pphBeam)">
      <animate attributeName="x" values="580;-240;580" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0D2530" stroke="#71DED2" stroke-opacity="0.45" stroke-width="1.2"/>
      <path d="M 0 -13 L 11 -8.5 V 0.5 C 11 7.5 6.2 12.2 0 14.5 C -6.2 12.2 -11 7.5 -11 0.5 V -8.5 Z" fill="none" stroke="#71DED2" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M -4 0.5 L -1 3.5 L 5 -2.5" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#0C2824" stroke="#34D399" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">PRIVACY HUB</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">App Privacy Hub <tspan fill="#71DED2" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#71DED2" font-size="13.5" font-weight="600">Plain-language privacy portal for my apps</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Clean, dark-and-light web hub presenting transparent privacy</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">policies for all Android apps published under Sajedur0.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="74" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="37" y="18" text-anchor="middle" fill="#6EE7B7">Privacy</text>
        <rect x="84" y="0" width="92" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="130" y="18" text-anchor="middle" fill="#67E8F9">Web Portal</text>
        <rect x="186" y="0" width="102" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="237" y="18" text-anchor="middle" fill="#93C5FD">Android Apps</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#71DED2" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#pphBorder)" stroke-width="1.5"/>
</svg>
