<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="pbTitle pbDesc">
  <title id="pbTitle">Project Backup Tools — One-Click Windows Backup App</title>
  <desc id="pbDesc">Desktop application for creating timestamped ZIP backups of project folders in one click with smart exclusions.</desc>

  <defs>
    <linearGradient id="pbBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091526"/>
      <stop offset="100%" stop-color="#0A1122"/>
    </linearGradient>

    <linearGradient id="pbBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="pbBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#71DED2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pbAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#71DED2" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pbClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pbClip)">
    <rect width="580" height="214" fill="url(#pbBg)"/>
    <rect width="580" height="214" fill="url(#pbAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#pbBeam)">
      <animate attributeName="x" values="580;-240;580" dur="6.4s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0D2538" stroke="#71DED2" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#71DED2" stroke-width="1.6" stroke-dasharray="16 8" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#34D399">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#0F2638" stroke="#71DED2" stroke-opacity="0.38" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">WINDOWS APP</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Project Backup Tools <tspan fill="#71DED2" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#71DED2" font-size="13.5" font-weight="600">One-click folder snapshots &amp; ZIP backups</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Create clean, timestamped ZIP backups of workspaces in a single</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">click with automatic folder exclusions and backup history.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="80" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="40" y="18" text-anchor="middle" fill="#67E8F9">Windows</text>
        <rect x="90" y="0" width="86" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="133" y="18" text-anchor="middle" fill="#6EE7B7">One-Click</text>
        <rect x="186" y="0" width="94" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="233" y="18" text-anchor="middle" fill="#93C5FD">ZIP Archive</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#71DED2" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#pbBorder)" stroke-width="1.5"/>
</svg>
