<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="tcmTitle tcmDesc">
  <title id="tcmTitle">Temp Cleaner — Fast Windows Temporary File Cleaner</title>
  <desc id="tcmDesc">Frees up disk space on Windows by scanning, reviewing, and deleting temp files, caches, crash dumps, and Recycle Bin. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="tcmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131424"/>
      <stop offset="100%" stop-color="#0A1222"/>
    </linearGradient>

    <linearGradient id="tcmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="tcmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="tcmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="tcmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tcmClip)">
    <rect width="300" height="300" fill="url(#tcmBg)"/>
    <rect width="300" height="300" fill="url(#tcmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#tcmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#231E22" stroke="#FCD34D" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="12.5" fill="none" stroke="#FCD34D" stroke-width="1.4" stroke-opacity="0.55"/>
      <polygon points="0,-10 2.8,-2.8 10,0 2.8,2.8 0,10 -2.8,2.8 -10,0 -2.8,-2.8" fill="#FCD34D">
        <animateTransform attributeName="transform" type="rotate" from="0" to="180" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Temp Cleaner</text>
      <text x="150" y="164" fill="#FCD34D" font-size="17.5" font-weight="600">Fast PC disk cleaner</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(52, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#67E8F9">Windows</text>
        <rect x="103" y="0" width="93" height="34" rx="11" fill="#2A1F14" stroke="#6B4C23"/>
        <text x="149.5" y="23" text-anchor="middle" fill="#FCD34D">Cleaner</text>
      </g>
      <text x="150" y="272" fill="#FCD34D" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#tcmBorder)" stroke-width="1.5"/>
</svg>
