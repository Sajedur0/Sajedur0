<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="pmTitle pmDesc">
  <title id="pmTitle">Payroll Management — Windows Attendance &amp; Salary Dashboard</title>
  <desc id="pmDesc">Desktop management dashboard for employee records, daily attendance, payroll calculation, and Excel reporting.</desc>

  <defs>
    <linearGradient id="pmBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1128"/>
      <stop offset="100%" stop-color="#091324"/>
    </linearGradient>

    <linearGradient id="pmBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="pmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A6A0EF"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pmClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pmClip)">
    <rect width="580" height="214" fill="url(#pmBg)"/>
    <rect width="580" height="214" fill="url(#pmAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#pmBeam)">
      <animate attributeName="x" values="580;-240;580" dur="6.9s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#191838" stroke="#A6A0EF" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-11" y="-12" width="22" height="24" rx="4" fill="none" stroke="#A6A0EF" stroke-width="1.6"/>
      <line x1="-6" y1="-5" x2="6" y2="-5" stroke="#C4B5FD" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="-6" y1="1" x2="6" y2="1" stroke="#A6A0EF" stroke-width="1.7" stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-6" y1="7" x2="2" y2="7" stroke="#6EE7B7" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#1A183B" stroke="#A6A0EF" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#A6A0EF">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">DESKTOP APP</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Payroll Management <tspan fill="#A6A0EF" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#C4B5FD" font-size="13.5" font-weight="600">Employee attendance &amp; payroll dashboard</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">All-in-one Windows dashboard for managing staff profiles, daily</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">attendance logs, salary sheets, charts, and Excel exports.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="80" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="40" y="18" text-anchor="middle" fill="#93C5FD">Windows</text>
        <rect x="90" y="0" width="94" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="137" y="18" text-anchor="middle" fill="#C4B5FD">Attendance</text>
        <rect x="194" y="0" width="98" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="243" y="18" text-anchor="middle" fill="#6EE7B7">Excel Export</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#C4B5FD" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#pmBorder)" stroke-width="1.5"/>
</svg>
