<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="gprTitle gprDesc">
  <title id="gprTitle">Google Photos Remover — Safe Bulk Photo Cleanup Extension</title>
  <desc id="gprDesc">Browser extension that bulk-deletes Google Photos in safe batches with live progress and zero external data access.</desc>

  <defs>
    <linearGradient id="gprBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151126"/>
      <stop offset="100%" stop-color="#0A1324"/>
    </linearGradient>

    <linearGradient id="gprBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="gprBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="gprAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="gprClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#gprClip)">
    <rect width="580" height="214" fill="url(#gprBg)"/>
    <rect width="580" height="214" fill="url(#gprAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#gprBeam)">
      <animate attributeName="x" values="-240;580;-240" dur="6.7s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#221632" stroke="#F9A8D4" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="0" cy="-6" r="5.5" fill="#F9A8D4" fill-opacity="0.3" stroke="#F9A8D4" stroke-width="1.5"/>
      <circle cx="6" cy="0" r="5.5" fill="#93C5FD" fill-opacity="0.3" stroke="#93C5FD" stroke-width="1.5"/>
      <circle cx="0" cy="6" r="5.5" fill="#6EE7B7" fill-opacity="0.3" stroke="#6EE7B7" stroke-width="1.5"/>
      <circle cx="-6" cy="0" r="5.5" fill="#FCD34D" fill-opacity="0.3" stroke="#FCD34D" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#261528" stroke="#F9A8D4" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#F9A8D4">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#F9A8D4" letter-spacing="0.8">EXTENSION</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Google Photos Remover <tspan fill="#F9A8D4" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#F9A8D4" font-size="13.5" font-weight="600">Safe bulk cleanup for Google Photos</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Browser extension for bulk-removing Google Photos in safe</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">batches with live progress tracking and zero account tracking.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="74" height="28" rx="8" fill="#2B1626" stroke="#6D2E5B"/>
        <text x="37" y="18" text-anchor="middle" fill="#F9A8D4">Chrome</text>
        <rect x="84" y="0" width="96" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="132" y="18" text-anchor="middle" fill="#C4B5FD">Bulk Delete</text>
        <rect x="190" y="0" width="72" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="226" y="18" text-anchor="middle" fill="#6EE7B7">Private</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#F9A8D4" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#gprBorder)" stroke-width="1.5"/>
</svg>
