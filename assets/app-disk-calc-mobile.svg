<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="dpcmTitle dpcmDesc">
  <title id="dpcmTitle">Disk Partition Calculator — Google Play Android App</title>
  <desc id="dpcmDesc">Calculate exact partition sizes for NTFS, FAT32, and exFAT drives with Windows Setup simulation and saved history. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="dpcmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081624"/>
      <stop offset="100%" stop-color="#0B1124"/>
    </linearGradient>

    <linearGradient id="dpcmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="dpcmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dpcmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="dpcmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dpcmClip)">
    <rect width="300" height="300" fill="url(#dpcmBg)"/>
    <rect width="300" height="300" fill="url(#dpcmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#dpcmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6.6s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0D2434" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#00F2FE" stroke-width="1.7"/>
      <path d="M 0 0 L 0 -13 A 13 13 0 0 1 11.2 6.5 Z" fill="#00F2FE" fill-opacity="0.32">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#0B192C" stroke="#6EE7B7" stroke-width="1.6"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Disk Partition</text>
      <text x="150" y="164" fill="#71DED2" font-size="17.5" font-weight="600">Exact drive size tool</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(34, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="129" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="64.5" y="23" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="139" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="185.5" y="23" text-anchor="middle" fill="#67E8F9">Storage</text>
      </g>
      <text x="150" y="272" fill="#6EE7B7" font-size="15" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#dpcmBorder)" stroke-width="1.5"/>
</svg>
