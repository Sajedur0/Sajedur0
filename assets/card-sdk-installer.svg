<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="asiTitle asiDesc">
  <title id="asiTitle">Android SDK Installer — One-Click Windows Setup Utility</title>
  <desc id="asiDesc">Guided Windows setup tool that automatically installs Android command tools, system paths, and a ready-to-boot virtual phone.</desc>

  <defs>
    <linearGradient id="asiBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091526"/>
      <stop offset="100%" stop-color="#0B1124"/>
    </linearGradient>

    <linearGradient id="asiBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="asiBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="asiAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="asiClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#asiClip)">
    <rect width="580" height="214" fill="url(#asiBg)"/>
    <rect width="580" height="214" fill="url(#asiAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#asiBeam)">
      <animate attributeName="x" values="580;-240;580" dur="7.4s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0E2238" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="11" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="5 3.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="none" stroke="#67E8F9" stroke-width="1.8"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#10233F" stroke="#00F2FE" stroke-opacity="0.38" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#67E8F9" letter-spacing="0.8">SETUP TOOL</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Android SDK Installer <tspan fill="#67E8F9" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#67E8F9" font-size="13.5" font-weight="600">Guided one-click Android setup for Windows</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Simple menu-driven Windows installer that configures Android</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">tools and a ready-to-run virtual phone automatically.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="80" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="40" y="18" text-anchor="middle" fill="#67E8F9">Windows</text>
        <rect x="90" y="0" width="92" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="136" y="18" text-anchor="middle" fill="#6EE7B7">Auto Setup</text>
        <rect x="192" y="0" width="84" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="234" y="18" text-anchor="middle" fill="#93C5FD">Emulator</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#67E8F9" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#asiBorder)" stroke-width="1.5"/>
</svg>
