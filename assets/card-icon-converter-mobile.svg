<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="icmTitle icmDesc">
  <title id="icmTitle">Icon Converter — Rust Utility for Working with Icons</title>
  <desc id="icmDesc">An icon conversion project written in Rust, exploring practical native utilities and tools. Compact tile for small screens.</desc>

  <defs>
    <linearGradient id="icmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#111126"/>
    </linearGradient>

    <linearGradient id="icmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="icmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="icmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="icmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icmClip)">
    <rect width="300" height="300" fill="url(#icmBg)"/>
    <rect width="300" height="300" fill="url(#icmAura)"/>

    <!-- Top Animated Shimmer Line -->
    <rect x="-160" y="1" width="160" height="4" fill="url(#icmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated Rust Prism Gear Icon -->
    <g transform="translate(150, 60)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#101E38" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="0,-13 11,-6.5 11,6.5 0,13 -11,6.5 -11,-6.5" fill="none" stroke="#60A5FA" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#00F2FE">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Tile Typography -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="132" fill="#F8FAFC" font-size="28" font-weight="800" letter-spacing="-0.5">Icon Converter</text>
      <text x="150" y="166" fill="#93C5FD" font-size="18" font-weight="600">High-speed icon tooling</text>

      <!-- Hairline Separator -->
      <path d="M 70 190 H 230" stroke="#1E2D45" stroke-width="1.2"/>

      <!-- Tech Stack Chips -->
      <g transform="translate(74.5, 206)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="66" height="34" rx="11" fill="#271B2C" stroke="#6E3B6E"/>
        <text x="33" y="23" text-anchor="middle" fill="#FDBA74">Rust</text>
        <rect x="76" y="0" width="75" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="113.5" y="23" text-anchor="middle" fill="#67E8F9">Icons</text>
      </g>

      <text x="150" y="274" fill="#93C5FD" font-size="15" font-weight="700">View source →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#icmBorder)" stroke-width="1.5"/>
</svg>
