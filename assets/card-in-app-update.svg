<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="iauTitle iauDesc">
  <title id="iauTitle">Android In-App Update — Seamless Google Play Update Module</title>
  <desc id="iauDesc">Integrates official Google Play flexible and immediate update flows to keep Android apps effortlessly current.</desc>

  <defs>
    <linearGradient id="iauBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1128"/>
      <stop offset="100%" stop-color="#091324"/>
    </linearGradient>

    <linearGradient id="iauBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="iauBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A6A0EF"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="iauAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#A6A0EF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="iauClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iauClip)">
    <rect width="580" height="214" fill="url(#iauBg)"/>
    <rect width="580" height="214" fill="url(#iauAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#iauBeam)">
      <animate attributeName="x" values="580;-240;580" dur="7.0s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#191838" stroke="#A6A0EF" stroke-opacity="0.45" stroke-width="1.2"/>
      <path d="M -11 -3 A 11.5 11.5 0 0 1 9 -7" fill="none" stroke="#A6A0EF" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 11 3 A 11.5 11.5 0 0 1 -9 7" fill="none" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round"/>
      <polygon points="10,-10 11.5,-3.5 5,-5.5" fill="#A6A0EF"/>
      <polygon points="-10,10 -11.5,3.5 -5,5.5" fill="#C4B5FD"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#1A183B" stroke="#A6A0EF" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#A6A0EF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">ANDROID TOOL</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Android In-App Update <tspan fill="#A6A0EF" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#C4B5FD" font-size="13.5" font-weight="600">Seamless Google Play update prompts</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Delivers smooth flexible and immediate update prompts directly</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">through Google Play so Android apps stay effortlessly current.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="76" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="38" y="18" text-anchor="middle" fill="#6EE7B7">Android</text>
        <rect x="86" y="0" width="96" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="134" y="18" text-anchor="middle" fill="#67E8F9">Google Play</text>
        <rect x="192" y="0" width="98" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="241" y="18" text-anchor="middle" fill="#C4B5FD">Auto Update</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#C4B5FD" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#iauBorder)" stroke-width="1.5"/>
</svg>
