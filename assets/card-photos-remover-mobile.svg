<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="gprmTitle gprmDesc">
  <title id="gprmTitle">Google Photos Remover — Safe Bulk Photo Cleanup Extension</title>
  <desc id="gprmDesc">Browser extension that bulk-deletes Google Photos in safe batches with live progress and zero external data access. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="gprmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151126"/>
      <stop offset="100%" stop-color="#0A1324"/>
    </linearGradient>

    <linearGradient id="gprmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="gprmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="gprmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="gprmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#gprmClip)">
    <rect width="300" height="300" fill="url(#gprmBg)"/>
    <rect width="300" height="300" fill="url(#gprmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#gprmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6.7s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#221632" stroke="#F9A8D4" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="0" cy="-6" r="5.5" fill="#F9A8D4" fill-opacity="0.3" stroke="#F9A8D4" stroke-width="1.5"/>
      <circle cx="6" cy="0" r="5.5" fill="#93C5FD" fill-opacity="0.3" stroke="#93C5FD" stroke-width="1.5"/>
      <circle cx="0" cy="6" r="5.5" fill="#6EE7B7" fill-opacity="0.3" stroke="#6EE7B7" stroke-width="1.5"/>
      <circle cx="-6" cy="0" r="5.5" fill="#FCD34D" fill-opacity="0.3" stroke="#FCD34D" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Photos Cleaner</text>
      <text x="150" y="164" fill="#F9A8D4" font-size="17.5" font-weight="600">Bulk photo cleanup</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(56.5, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="84" height="34" rx="11" fill="#2B1626" stroke="#6D2E5B"/>
        <text x="42" y="23" text-anchor="middle" fill="#F9A8D4">Chrome</text>
        <rect x="94" y="0" width="93" height="34" rx="11" fill="#1E1B3A" stroke="#433878"/>
        <text x="140.5" y="23" text-anchor="middle" fill="#C4B5FD">Private</text>
      </g>
      <text x="150" y="272" fill="#F9A8D4" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#gprmBorder)" stroke-width="1.5"/>
</svg>
