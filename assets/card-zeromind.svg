<svg xmlns="http://www.w3.org/2000/svg" width="580" height="220" viewBox="0 0 580 220" fill="none" role="img" aria-labelledby="zmTitle zmDesc">
  <title id="zmTitle">ZeroMind — Cross-Platform Chat Application built with Flutter</title>
  <desc id="zmDesc">A cross-platform chat application with dark mode, clean interface, and local-only data storage.</desc>

  <defs>
    <linearGradient id="zmBg" x1="0" y1="0" x2="580" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#0D1025"/>
    </linearGradient>

    <linearGradient id="zmBorder" x1="0" y1="0" x2="580" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="zmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="zmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="zmClip">
      <rect x="1" y="1" width="578" height="218" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#zmClip)">
    <rect width="580" height="220" fill="url(#zmBg)"/>
    <rect width="580" height="220" fill="url(#zmAura)"/>

    <!-- Top Animated Shimmer Line -->
    <rect x="-200" y="1" width="240" height="3" fill="url(#zmBeam)">
      <animate attributeName="x" values="-240;580;-240" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated Geometric Core Icon -->
    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0E223D" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#00F2FE" stroke-width="1.4" stroke-dasharray="6 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#A6A0EF">
        <animate attributeName="r" values="4.5;7;4.5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-13" r="2.2" fill="#00F2FE"/>
      <circle cx="11" cy="7" r="2.2" fill="#71DED2"/>
      <circle cx="-11" cy="7" r="2.2" fill="#C4B5FD"/>
    </g>

    <!-- Category Badge (Top Right) -->
    <g transform="translate(422, 28)">
      <rect width="132" height="26" rx="13" fill="#10233F" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#71DED2" letter-spacing="0.8">OPEN SOURCE</text>
    </g>

    <!-- Card Typography -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="21" font-weight="800" letter-spacing="-0.4">ZeroMind <tspan fill="#00F2FE" font-size="18">↗</tspan></text>
      <text x="82" y="67" fill="#71DED2" font-size="13.5" font-weight="600">A cross-platform chat application.</text>

      <text x="26" y="108" fill="#B0C0D6" font-size="13.5">A modern cross-platform chat application with multilingual support,</text>
      <text x="26" y="130" fill="#94A8C4" font-size="13.5">sleek dark mode interface, and privacy-first local storage.</text>

      <!-- Tech Stack Pills -->
      <g transform="translate(26, 162)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="68" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="34" y="18" text-anchor="middle" fill="#67E8F9">Flutter</text>

        <rect x="78" y="0" width="56" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="106" y="18" text-anchor="middle" fill="#93C5FD">Dart</text>

        <rect x="144" y="0" width="100" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="194" y="18" text-anchor="middle" fill="#C4B5FD">Open Source</text>

        <rect x="254" y="0" width="84" height="28" rx="8" fill="#122832" stroke="#23535D"/>
        <text x="296" y="18" text-anchor="middle" fill="#86EFAC">Local DB</text>
      </g>

      <!-- Action Indicator -->
      <text x="554" y="181" text-anchor="end" fill="#71DED2" font-size="12" font-weight="700"> Source →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="218" rx="18" stroke="url(#zmBorder)" stroke-width="1.5"/>
</svg>
