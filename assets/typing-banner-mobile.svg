<svg xmlns="http://www.w3.org/2000/svg" width="720" height="100" viewBox="0 0 720 100" fill="none" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">Interactive Status Terminal — Sajedur Rahman Roni</title>
  <desc id="termDesc">Animated command bar cycling through Flutter app development, Python and Rust automation, and clean architecture focus. Compact layout for small screens.</desc>

  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="720" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="50%" stop-color="#0C172E"/>
      <stop offset="100%" stop-color="#091022"/>
    </linearGradient>

    <linearGradient id="termStroke" x1="0" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#A6A0EF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <clipPath id="termClip">
      <rect x="1" y="1" width="718" height="98" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#termClip)">
    <rect x="1" y="1" width="718" height="98" rx="14" fill="url(#termBg)"/>

    <!-- Left Prompt Badge -->
    <rect x="20" y="30" width="182" height="40" rx="11" fill="#0F1E38" stroke="#1E3A5F" stroke-width="1.2"/>
    <circle cx="40" cy="50" r="5" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="56" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" font-weight="700" fill="#71DED2">~/sajedur0 <tspan fill="#A6A0EF">❯</tspan></text>

    <!-- Cycling Terminal Command Lines -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="600">
      <!-- Message 1 -->
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
        <text x="222" y="57" fill="#E2E8F0">
          <tspan fill="#C4B5FD">ship_apps</tspan>(<tspan fill="#67E8F9">'ZeroMind'</tspan>, <tspan fill="#67E8F9">'Tools'</tspan>);
        </text>
      </g>

      <!-- Message 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
        <text x="222" y="57" fill="#E2E8F0">
          <tspan fill="#71DED2">automate</tspan>([<tspan fill="#86EFAC">'Python'</tspan>, <tspan fill="#86EFAC">'Rust'</tspan>]);
        </text>
      </g>

      <!-- Message 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
        <text x="222" y="57" fill="#E2E8F0">
          <tspan fill="#93C5FD">craft_ui</tspan>(<tspan fill="#FDE68A">'clean · fast'</tspan>);
        </text>
      </g>
    </g>

    <!-- Right Hand Live Equalizer -->
    <g transform="translate(668, 40)" fill="#00F2FE">
      <rect x="0" y="8" width="5" height="10" rx="2.5">
        <animate attributeName="y" values="8;2;8" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="10;18;10" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="2" width="5" height="18" rx="2.5" fill="#71DED2">
        <animate attributeName="y" values="2;10;2" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="18;8;18" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="5" width="5" height="14" rx="2.5" fill="#A6A0EF">
        <animate attributeName="y" values="5;1;5" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;20;14" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="9" width="5" height="9" rx="2.5">
        <animate attributeName="y" values="9;3;9" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="9;16;9" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Bottom Sweeping Progress Laser -->
    <rect x="0" y="96" width="720" height="3" fill="#111C33"/>
    <rect x="0" y="96" width="240" height="3" fill="url(#progGrad)">
      <animate attributeName="x" values="-240;720" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="718" height="98" rx="14" stroke="url(#termStroke)" stroke-width="1.2"/>
</svg>
