<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Linear gradient for the rotating neon border -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E6FE" />
      <stop offset="50%" stop-color="#7B2FBE" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip path for circular avatar -->
    <clipPath id="avatarCircle">
      <circle cx="200" cy="200" r="150" />
    </clipPath>
  </defs>

  <style>
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 230, 254, 0.6)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(123, 47, 190, 0.9)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 230, 254, 0.6)); }
    }
    .glowing-ring {
      transform-origin: 200px 200px;
      animation: rotate 6s linear infinite;
    }
    .pulse-container {
      transform-origin: 200px 200px;
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Pulsing main container -->
  <g class="pulse-container">
    <!-- Outer neon animated ring -->
    <circle cx="200" cy="200" r="162" fill="none" stroke="url(#neonGlow)" stroke-width="8" class="glowing-ring" filter="url(#glow)" />
    
    <!-- Dark background circle for avatar outline separation -->
    <circle cx="200" cy="200" r="156" fill="#0D1117" />
    
    <!-- Avatar Image clipped to circle -->
    <image href="data:image/png;base64," x="50" y="50" width="300" height="300" clip-path="url(#avatarCircle)" />
  </g>
</svg>
