<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="aoTitle aoDesc">
  <title id="aoTitle">APK Organizer — Google Play Android App</title>
  <desc id="aoDesc">Find, inspect, organize, back up, and manage APK, XAPK, APKS, and AAB package files locally on Android.</desc>

  <defs>
    <linearGradient id="aoBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07171B"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="aoBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="aoBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="aoAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="aoClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#aoClip)">
    <rect width="580" height="214" fill="url(#aoBg)"/>
    <rect width="580" height="214" fill="url(#aoAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#aoBeam)">
      <animate attributeName="x" values="-240;580;-240" dur="6.2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0C2627" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-11" y="-10" width="22" height="21" rx="4.5" fill="none" stroke="#34D399" stroke-width="1.7"/>
      <path d="M -11 -3 H 11" stroke="#34D399" stroke-width="1.4" opacity="0.7"/>
      <circle cx="0" cy="4.5" r="4" fill="#34D399">
        <animate attributeName="r" values="3.2;4.8;3.2" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M -4 -10 L -6.5 -14 M 4 -10 L 6.5 -14" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#0C2824" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">GOOGLE PLAY</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">APK Organizer <tspan fill="#34D399" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#6EE7B7" font-size="13.5" font-weight="600">Local APK &amp; App Package Manager</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Scan, inspect, tag, back up, and organize APK, XAPK, APKS, and</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">AAB files along with installed apps completely offline.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="96" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="48" y="18" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="106" y="0" width="104" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="158" y="18" text-anchor="middle" fill="#67E8F9">File Manager</text>
        <rect x="220" y="0" width="72" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="256" y="18" text-anchor="middle" fill="#93C5FD">Offline</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#6EE7B7" font-size="12" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#aoBorder)" stroke-width="1.5"/>
</svg>
