<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none" role="img" aria-labelledby="tkTitle tkDesc">
  <title id="tkTitle">Engineering Architecture &amp; Toolkit Pipeline</title>
  <desc id="tkDesc">Animated four-stage toolkit architecture connecting Apps and Interfaces, Web and Cloud, Scripts and Automation, and Systems and Tools.</desc>

  <defs>
    <linearGradient id="tkBg" x1="0" y1="0" x2="1200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="50%" stop-color="#0B1428"/>
      <stop offset="100%" stop-color="#090F22"/>
    </linearGradient>

    <linearGradient id="tkStroke" x1="0" y1="0" x2="1200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="tkBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#71DED2"/>
      <stop offset="100%" stop-color="#A6A0EF"/>
    </linearGradient>

    <filter id="tkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Container -->
  <rect x="1" y="1" width="1198" height="208" rx="20" fill="url(#tkBg)" stroke="url(#tkStroke)" stroke-width="1.5"/>

  <!-- Connecting Data Conduits Behind Cards -->
  <g stroke="#1E3A5F" stroke-width="2" stroke-dasharray="5 5">
    <path d="M 284 105 H 322"/>
    <path d="M 580 105 H 618"/>
    <path d="M 876 105 H 914"/>
  </g>

  <!-- Animated Data Packets Traveling Across Conduits -->
  <circle r="4" fill="#00F2FE" filter="url(#tkGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 160 105 L 1040 105"/>
  </circle>
  <circle r="4" fill="#A6A0EF" filter="url(#tkGlow)">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M 160 105 L 1040 105"/>
  </circle>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- ==================== NODE 01: APPS & INTERFACES ==================== -->
    <g transform="translate(24, 24)">
      <rect width="264" height="162" rx="14" fill="#0B162C" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="4" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="30" fill="#00F2FE" font-size="11" font-weight="700" letter-spacing="1.4">01 // APPS &amp; UI</text>
      <text x="20" y="60" fill="#F8FAFC" font-size="17" font-weight="800">Mobile &amp; Desktop</text>
      <text x="20" y="86" fill="#94A8C4" font-size="12.5">Flutter · Dart · Android</text>
      <text x="20" y="106" fill="#94A8C4" font-size="12.5">Cross-platform UI · State Mgmt</text>
      <rect x="20" y="132" width="224" height="6" rx="3" fill="#15233E"/>
      <rect x="20" y="132" width="206" height="6" rx="3" fill="url(#tkBarGrad)">
        <animate attributeName="width" values="180;214;180" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ==================== NODE 02: WEB & CLOUD ==================== -->
    <g transform="translate(320, 24)">
      <rect width="264" height="162" rx="14" fill="#0B162C" stroke="#71DED2" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="4" fill="#71DED2">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="30" fill="#71DED2" font-size="11" font-weight="700" letter-spacing="1.4">02 // WEB &amp; CLOUD</text>
      <text x="20" y="60" fill="#F8FAFC" font-size="17" font-weight="800">Connected Services</text>
      <text x="20" y="86" fill="#94A8C4" font-size="12.5">Firebase · REST APIs · Web</text>
      <text x="20" y="106" fill="#94A8C4" font-size="12.5">Play Core · Local Persistence</text>
      <rect x="20" y="132" width="224" height="6" rx="3" fill="#15233E"/>
      <rect x="20" y="132" width="188" height="6" rx="3" fill="url(#tkBarGrad)">
        <animate attributeName="width" values="160;198;160" dur="4.2s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ==================== NODE 03: SCRIPTS & AUTOMATION ==================== -->
    <g transform="translate(616, 24)">
      <rect width="264" height="162" rx="14" fill="#0B162C" stroke="#A6A0EF" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="4" fill="#A6A0EF">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="30" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="1.4">03 // AUTOMATION</text>
      <text x="20" y="60" fill="#F8FAFC" font-size="17" font-weight="800">Scripts &amp; Web</text>
      <text x="20" y="86" fill="#94A8C4" font-size="12.5">Python · TypeScript · JS</text>
      <text x="20" y="106" fill="#94A8C4" font-size="12.5">HTML5 · CSS3 · PowerShell</text>
      <rect x="20" y="132" width="224" height="6" rx="3" fill="#15233E"/>
      <rect x="20" y="132" width="194" height="6" rx="3" fill="url(#tkBarGrad)">
        <animate attributeName="width" values="168;202;168" dur="3.8s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ==================== NODE 04: SYSTEMS & TOOLING ==================== -->
    <g transform="translate(912, 24)">
      <rect width="264" height="162" rx="14" fill="#0B162C" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="4" fill="#60A5FA">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="30" fill="#93C5FD" font-size="11" font-weight="700" letter-spacing="1.4">04 // SYSTEMS LAB</text>
      <text x="20" y="60" fill="#F8FAFC" font-size="17" font-weight="800">Native &amp; Tools</text>
      <text x="20" y="86" fill="#94A8C4" font-size="12.5">Rust · C++ · C# · MS SQL</text>
      <text x="20" y="106" fill="#94A8C4" font-size="12.5">Git · GitHub Actions · Linux</text>
      <rect x="20" y="132" width="224" height="6" rx="3" fill="#15233E"/>
      <rect x="20" y="132" width="176" height="6" rx="3" fill="url(#tkBarGrad)">
        <animate attributeName="width" values="148;188;148" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
