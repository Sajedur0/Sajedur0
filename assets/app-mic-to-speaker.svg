<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="mtsTitle mtsDesc">
  <title id="mtsTitle">Mic to Speaker — Google Play Android App</title>
  <desc id="mtsDesc">Stream live microphone audio to Bluetooth, AUX, or USB speakers in the background with optional WAV recording.</desc>

  <defs>
    <linearGradient id="mtsBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081722"/>
      <stop offset="100%" stop-color="#0D1126"/>
    </linearGradient>

    <linearGradient id="mtsBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="mtsBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="mtsAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#71DED2" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="mtsClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mtsClip)">
    <rect width="580" height="214" fill="url(#mtsBg)"/>
    <rect width="580" height="214" fill="url(#mtsAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#mtsBeam)">
      <animate attributeName="x" values="-240;580;-240" dur="7.0s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0E2532" stroke="#71DED2" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-4.5" y="-13" width="9" height="15" rx="4.5" fill="none" stroke="#71DED2" stroke-width="1.7"/>
      <path d="M -9.5 -3 A 9.5 9.5 0 0 0 9.5 -3" fill="none" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="6.5" x2="0" y2="12.5" stroke="#71DED2" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="-5" y1="12.5" x2="5" y2="12.5" stroke="#71DED2" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="0" cy="-5.5" r="2.2" fill="#34D399">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#0C2824" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">GOOGLE PLAY</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Mic to Speaker <tspan fill="#71DED2" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#71DED2" font-size="13.5" font-weight="600">Live Microphone to Bluetooth &amp; Speaker</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Stream live voice from your phone mic to Bluetooth, AUX, or USB</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">speakers in the background with optional WAV recording.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="96" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="48" y="18" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="106" y="0" width="92" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="152" y="18" text-anchor="middle" fill="#67E8F9">Live Audio</text>
        <rect x="208" y="0" width="82" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="249" y="18" text-anchor="middle" fill="#C4B5FD">Recorder</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#6EE7B7" font-size="12" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#mtsBorder)" stroke-width="1.5"/>
</svg>
