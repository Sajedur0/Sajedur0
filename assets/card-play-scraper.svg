<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="gpsTitle gpsDesc">
  <title id="gpsTitle">Google Play Scraper — App Store Info Lookup Tool</title>
  <desc id="gpsDesc">Web utility for extracting public app titles, icons, ratings, and store details from Google Play URLs.</desc>

  <defs>
    <linearGradient id="gpsBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#0E1125"/>
    </linearGradient>

    <linearGradient id="gpsBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="gpsBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="gpsAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="gpsClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#gpsClip)">
    <rect width="580" height="214" fill="url(#gpsBg)"/>
    <rect width="580" height="214" fill="url(#gpsAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#gpsBeam)">
      <animate attributeName="x" values="-240;580;-240" dur="6.6s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#10203A" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="-7,-11 11,0 -7,11" fill="#60A5FA" fill-opacity="0.28" stroke="#60A5FA" stroke-width="1.8" stroke-linejoin="round">
        <animate attributeName="fill-opacity" values="0.2;0.6;0.2" dur="2.4s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#11203D" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#60A5FA">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">WEB UTILITY</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Google Play Scraper <tspan fill="#60A5FA" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#93C5FD" font-size="13.5" font-weight="600">Quickly extract Google Play app details</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Clean web service that fetches public app titles, icons, ratings,</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">and listing details from any Google Play Store link.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="80" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="40" y="18" text-anchor="middle" fill="#93C5FD">Web Tool</text>
        <rect x="90" y="0" width="90" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="135" y="18" text-anchor="middle" fill="#6EE7B7">Play Store</text>
        <rect x="190" y="0" width="98" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="239" y="18" text-anchor="middle" fill="#67E8F9">Fast Lookup</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#93C5FD" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#gpsBorder)" stroke-width="1.5"/>
</svg>
