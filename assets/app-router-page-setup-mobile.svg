<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" fill="none" role="img" aria-labelledby="rpsmTitle rpsmDesc">
  <title id="rpsmTitle">Router Page Setup — Google Play Android App by Sajedur Rahman Roni</title>
  <desc id="rpsmDesc">Automatically detects your Wi-Fi gateway to open router admin settings instantly, with live signal graphs and ping testing. Compact card for mobile screens.</desc>

  <defs>
    <linearGradient id="rpsmBg" x1="0" y1="0" x2="640" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06181A"/>
      <stop offset="100%" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="rpsmBorder" x1="0" y1="0" x2="640" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rpsmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rpsmClip">
      <rect x="1" y="1" width="638" height="302" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rpsmClip)">
    <rect width="640" height="304" fill="url(#rpsmBg)"/>
    <rect x="-220" y="1" width="220" height="4" fill="url(#rpsmBeam)">
      <animate attributeName="x" values="-220;640;-220" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(320, 54)">
      <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#0C2924" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.4"/>
      <path d="M -10 7 H 10 C 11.5 7 12.5 8 12.5 9.5 V 12.5 C 12.5 14 11.5 15 10 15 H -10 C -11.5 15 -12.5 14 -12.5 12.5 V 9.5 C -12.5 8 -11.5 7 -10 7 Z" fill="none" stroke="#34D399" stroke-width="1.7"/>
      <circle cx="-6.5" cy="11" r="1.5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-1.5" cy="11" r="1.5" fill="#34D399"/>
      <line x1="0" y1="7" x2="0" y2="-1" stroke="#34D399" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M -6 -4 A 8.5 8.5 0 0 1 6 -4" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M -10.5 -8.5 A 14.5 14.5 0 0 1 10.5 -8.5" fill="none" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="320" y="126" fill="#F8FAFC" font-size="32" font-weight="800" letter-spacing="-0.5">Router Page Setup</text>
      <text x="320" y="160" fill="#6EE7B7" font-size="20" font-weight="600">Instant Router Access &amp; Wi-Fi Monitor</text>
      <path d="M 90 184 H 550" stroke="#1B3544" stroke-width="1.2"/>
      <g transform="translate(102, 200)" font-size="17" font-weight="700">
        <rect x="0" y="0" width="144" height="38" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="72" y="25" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="156" y="0" width="175" height="38" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="243.5" y="25" text-anchor="middle" fill="#67E8F9">Wi-Fi &amp; Router</text>
        <rect x="343" y="0" width="93" height="38" rx="11" fill="#1E1B3A" stroke="#433878"/>
        <text x="389.5" y="25" text-anchor="middle" fill="#C4B5FD">No Ads</text>
      </g>
      <text x="320" y="276" fill="#6EE7B7" font-size="19" font-weight="700">Get it on Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="638" height="302" rx="18" stroke="url(#rpsmBorder)" stroke-width="1.5"/>
</svg>
