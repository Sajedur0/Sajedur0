<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="aomTitle aomDesc">
  <title id="aomTitle">APK Organizer — Google Play Android App</title>
  <desc id="aomDesc">Find, inspect, organize, back up, and manage APK, XAPK, APKS, and AAB package files locally on Android. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="aomBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07171B"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="aomBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="aomBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="aomAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="aomClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#aomClip)">
    <rect width="300" height="300" fill="url(#aomBg)"/>
    <rect width="300" height="300" fill="url(#aomAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#aomBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6.2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0C2627" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-11" y="-10" width="22" height="21" rx="4.5" fill="none" stroke="#34D399" stroke-width="1.7"/>
      <path d="M -11 -3 H 11" stroke="#34D399" stroke-width="1.4" opacity="0.7"/>
      <circle cx="0" cy="4.5" r="4" fill="#34D399">
        <animate attributeName="r" values="3.2;4.8;3.2" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M -4 -10 L -6.5 -14 M 4 -10 L 6.5 -14" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">APK Organizer</text>
      <text x="150" y="164" fill="#6EE7B7" font-size="17.5" font-weight="600">APK &amp; package manager</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(34, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="129" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="64.5" y="23" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="139" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="185.5" y="23" text-anchor="middle" fill="#67E8F9">Offline</text>
      </g>
      <text x="150" y="272" fill="#6EE7B7" font-size="15" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#aomBorder)" stroke-width="1.5"/>
</svg>
