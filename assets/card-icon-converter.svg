<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="icTitle icDesc">
  <title id="icTitle">ICO Converter — Multi-Resolution Windows Icon Utility</title>
  <desc id="icDesc">Lightweight desktop utility that transforms images into crisp, multi-resolution Windows .ico files with instant previews.</desc>

  <defs>
    <linearGradient id="icBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#111126"/>
    </linearGradient>

    <linearGradient id="icBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="icBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="icAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="icClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icClip)">
    <rect width="580" height="214" fill="url(#icBg)"/>
    <rect width="580" height="214" fill="url(#icAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#icBeam)">
      <animate attributeName="x" values="580;-240;580" dur="7.2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#101E38" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="0,-13 12,8 -12,8" fill="none" stroke="#60A5FA" stroke-width="1.7" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </polygon>
      <circle r="3.5" fill="#67E8F9">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#11203D" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#60A5FA">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">DESKTOP TOOL</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">ICO Converter <tspan fill="#60A5FA" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#93C5FD" font-size="13.5" font-weight="600">Multi-resolution Windows .ico creator</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Convert everyday images into sharp multi-size Windows .ico files</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">with instant canvas previews and fast one-click export.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="78" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="39" y="18" text-anchor="middle" fill="#93C5FD">Desktop</text>
        <rect x="88" y="0" width="92" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="134" y="18" text-anchor="middle" fill="#67E8F9">Icon Maker</text>
        <rect x="190" y="0" width="100" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="240" y="18" text-anchor="middle" fill="#C4B5FD">Live Preview</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#93C5FD" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#icBorder)" stroke-width="1.5"/>
</svg>
