<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" fill="none" role="img" aria-labelledby="rpsTitle rpsDesc">
  <title id="rpsTitle">Router Page Setup — Google Play Android App by Sajedur Rahman Roni</title>
  <desc id="rpsDesc">Automatically detects your Wi-Fi gateway to open router admin settings instantly, with live signal graphs and ping testing.</desc>

  <defs>
    <linearGradient id="rpsBg" x1="0" y1="0" x2="1200" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06181A"/>
      <stop offset="55%" stop-color="#091526"/>
      <stop offset="100%" stop-color="#0C1126"/>
    </linearGradient>
    <linearGradient id="rpsBorder" x1="0" y1="0" x2="1200" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rpsBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rpsAura" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rpsClip">
      <rect x="1" y="1" width="1198" height="210" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rpsClip)">
    <rect width="1200" height="212" fill="url(#rpsBg)"/>
    <rect width="1200" height="212" fill="url(#rpsAura)"/>
    <rect x="-320" y="1" width="320" height="3" fill="url(#rpsBeam)">
      <animate attributeName="x" values="-320;1200;-320" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(58, 54)">
      <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#0C2924" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.4"/>
      <path d="M -10 7 H 10 C 11.5 7 12.5 8 12.5 9.5 V 12.5 C 12.5 14 11.5 15 10 15 H -10 C -11.5 15 -12.5 14 -12.5 12.5 V 9.5 C -12.5 8 -11.5 7 -10 7 Z" fill="none" stroke="#34D399" stroke-width="1.7"/>
      <circle cx="-6.5" cy="11" r="1.5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-1.5" cy="11" r="1.5" fill="#34D399"/>
      <line x1="0" y1="7" x2="0" y2="-1" stroke="#34D399" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M -6 -4 A 8.5 8.5 0 0 1 6 -4" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M -10.5 -8.5 A 14.5 14.5 0 0 1 10.5 -8.5" fill="none" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(928, 28)">
      <rect width="240" height="28" rx="14" fill="#0C2824" stroke="#34D399" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="14" r="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">GOOGLE PLAY · FEATURED</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="102" y="49" fill="#F8FAFC" font-size="24" font-weight="800" letter-spacing="-0.4">Router Page Setup <tspan fill="#34D399" font-size="20">↗</tspan></text>
      <text x="102" y="73" fill="#6EE7B7" font-size="14.5" font-weight="600">Instant Router Admin Access &amp; Live Wi-Fi Signal Monitor</text>
      <text x="32" y="112" fill="#CBD5E1" font-size="14.5">Connect to Wi-Fi and open your router admin panel automatically without typing IP addresses.</text>
      <text x="32" y="135" fill="#94A8C4" font-size="14.5">Includes full Wi-Fi connection details, live signal quality graphs, distance estimate, and ping test.</text>

      <g transform="translate(32, 158)" font-size="12" font-weight="700">
        <rect x="0" y="0" width="98" height="30" rx="9" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="49" y="19.5" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="108" y="0" width="112" height="30" rx="9" fill="#10253A" stroke="#234B6E"/>
        <text x="164" y="19.5" text-anchor="middle" fill="#67E8F9">Wi-Fi &amp; Router</text>
        <rect x="230" y="0" width="104" height="30" rx="9" fill="#16203B" stroke="#2D3F6E"/>
        <text x="282" y="19.5" text-anchor="middle" fill="#93C5FD">Signal Graph</text>
        <rect x="344" y="0" width="74" height="30" rx="9" fill="#1E1B3A" stroke="#433878"/>
        <text x="381" y="19.5" text-anchor="middle" fill="#C4B5FD">No Ads</text>
      </g>
      <g transform="translate(946, 154)">
        <rect width="222" height="36" rx="10" fill="#0C2924" stroke="#34D399" stroke-opacity="0.6" stroke-width="1.2"/>
        <text x="111" y="23" text-anchor="middle" fill="#6EE7B7" font-size="13.5" font-weight="700">Get it on Google Play →</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="210" rx="18" stroke="url(#rpsBorder)" stroke-width="1.5"/>
</svg>
