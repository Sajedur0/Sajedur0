<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="psvmTitle psvmDesc">
  <title id="psvmTitle">PinSaver Video Downloader — Google Play Android App</title>
  <desc id="psvmDesc">Save publicly available Pinterest videos directly to your Android device for offline playback without an account. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="psvmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131126"/>
      <stop offset="100%" stop-color="#091422"/>
    </linearGradient>

    <linearGradient id="psvmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="psvmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="psvmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="psvmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#psvmClip)">
    <rect width="300" height="300" fill="url(#psvmBg)"/>
    <rect width="300" height="300" fill="url(#psvmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#psvmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.3s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#211630" stroke="#F9A8D4" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#F9A8D4" stroke-width="1.5" stroke-dasharray="14 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <path d="M 0 -7 V 4 M -5 0 L 0 5.5 L 5 0" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0,-1.5; 0,1.5; 0,-1.5" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <line x1="-6" y1="8.5" x2="6" y2="8.5" stroke="#F9A8D4" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">PinSaver</text>
      <text x="150" y="164" fill="#F9A8D4" font-size="17.5" font-weight="600">Pinterest video saver</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(43, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="129" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="64.5" y="23" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="139" y="0" width="75" height="34" rx="11" fill="#2B1626" stroke="#6D2E5B"/>
        <text x="176.5" y="23" text-anchor="middle" fill="#F9A8D4">Video</text>
      </g>
      <text x="150" y="272" fill="#6EE7B7" font-size="15" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#psvmBorder)" stroke-width="1.5"/>
</svg>
