<svg xmlns="http://www.w3.org/2000/svg" width="580" height="220" viewBox="0 0 580 220" fill="none" role="img" aria-labelledby="icTitle icDesc">
  <title id="icTitle">Icon Converter — Rust Utility for Working with Icons</title>
  <desc id="icDesc">An icon conversion project written in Rust, exploring practical native utilities and tools.</desc>

  <defs>
    <linearGradient id="icBg" x1="0" y1="0" x2="580" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#111126"/>
    </linearGradient>

    <linearGradient id="icBorder" x1="0" y1="0" x2="580" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="icBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="icAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="icClip">
      <rect x="1" y="1" width="578" height="218" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icClip)">
    <rect width="580" height="220" fill="url(#icBg)"/>
    <rect width="580" height="220" fill="url(#icAura)"/>

    <!-- Top Animated Shimmer Line -->
    <rect x="-200" y="1" width="240" height="3" fill="url(#icBeam)">
      <animate attributeName="x" values="580;-240;580" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated Rust Prism Gear Icon -->
    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#101E38" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="0,-13 11,-6.5 11,6.5 0,13 -11,6.5 -11,-6.5" fill="none" stroke="#60A5FA" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#00F2FE">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Category Badge -->
    <g transform="translate(422, 28)">
      <rect width="132" height="26" rx="13" fill="#11203D" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#60A5FA">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">NATIVE TOOLING</text>
    </g>

    <!-- Card Typography -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="21" font-weight="800" letter-spacing="-0.4">Icon Converter <tspan fill="#60A5FA" font-size="18">↗</tspan></text>
      <text x="82" y="67" fill="#93C5FD" font-size="13.5" font-weight="600">A utility for working with icons.</text>

      <text x="26" y="108" fill="#B0C0D6" font-size="13.5">An icon conversion project written in Rust, exploring high-speed</text>
      <text x="26" y="130" fill="#94A8C4" font-size="13.5">native tools and utilities beyond the Flutter and Dart ecosystem.</text>

      <!-- Tech Stack Pills -->
      <g transform="translate(26, 162)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="58" height="28" rx="8" fill="#271B2C" stroke="#6E3B6E"/>
        <text x="29" y="18" text-anchor="middle" fill="#FDBA74">Rust</text>

        <rect x="68" y="0" width="62" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="99" y="18" text-anchor="middle" fill="#67E8F9">Icons</text>

        <rect x="140" y="0" width="76" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="178" y="18" text-anchor="middle" fill="#93C5FD">Utilities</text>
      </g>

      <text x="554" y="181" text-anchor="end" fill="#93C5FD" font-size="12" font-weight="700">Source →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="218" rx="18" stroke="url(#icBorder)" stroke-width="1.5"/>
</svg>
