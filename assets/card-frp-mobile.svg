<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="frpmTitle frpmDesc">
  <title id="frpmTitle">FRP Bypass Center — Direct Android Recovery Utility Portal</title>
  <desc id="frpmDesc">Searchable static download portal providing essential unlock utilities, launchers, and settings shortcuts for Android recovery. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="frpmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141322"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>

    <linearGradient id="frpmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="frpmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="frpmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frpmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frpmClip)">
    <rect width="300" height="300" fill="url(#frpmBg)"/>
    <rect width="300" height="300" fill="url(#frpmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#frpmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#231E1E" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-10" y="-1" width="20" height="14" rx="4" fill="none" stroke="#34D399" stroke-width="1.7"/>
      <path d="M -5.5 -1 V -6.5 A 5.5 5.5 0 0 1 5.5 -6.5" fill="none" stroke="#FCD34D" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="2.4" fill="#FCD34D">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">FRP Center</text>
      <text x="150" y="164" fill="#FCD34D" font-size="17.5" font-weight="600">Android unlock hub</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(52, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#6EE7B7">Android</text>
        <rect x="103" y="0" width="93" height="34" rx="11" fill="#2A1F14" stroke="#6B4C23"/>
        <text x="149.5" y="23" text-anchor="middle" fill="#FCD34D">Web Hub</text>
      </g>
      <text x="150" y="272" fill="#FCD34D" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#frpmBorder)" stroke-width="1.5"/>
</svg>
