<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="dpcTitle dpcDesc">
  <title id="dpcTitle">Disk Partition Calculator — Google Play Android App</title>
  <desc id="dpcDesc">Calculate exact partition sizes for NTFS, FAT32, and exFAT drives with Windows Setup simulation and saved history.</desc>

  <defs>
    <linearGradient id="dpcBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081624"/>
      <stop offset="100%" stop-color="#0B1124"/>
    </linearGradient>

    <linearGradient id="dpcBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="dpcBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dpcAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="dpcClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dpcClip)">
    <rect width="580" height="214" fill="url(#dpcBg)"/>
    <rect width="580" height="214" fill="url(#dpcAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#dpcBeam)">
      <animate attributeName="x" values="580;-240;580" dur="6.6s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#0D2434" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#00F2FE" stroke-width="1.7"/>
      <path d="M 0 0 L 0 -13 A 13 13 0 0 1 11.2 6.5 Z" fill="#00F2FE" fill-opacity="0.32">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#0B192C" stroke="#6EE7B7" stroke-width="1.6"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#0C2824" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">GOOGLE PLAY</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">Disk Partition Calc <tspan fill="#00F2FE" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#71DED2" font-size="13.5" font-weight="600">Exact Storage &amp; Drive Partition Calculator</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Compute exact NTFS, FAT32, and exFAT partition sizes with</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">Windows Setup overhead simulation and saved local history.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="96" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="48" y="18" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="106" y="0" width="102" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="157" y="18" text-anchor="middle" fill="#67E8F9">Storage Tool</text>
        <rect x="218" y="0" width="72" height="28" rx="8" fill="#1E1B3A" stroke="#433878"/>
        <text x="254" y="18" text-anchor="middle" fill="#C4B5FD">No Ads</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#6EE7B7" font-size="12" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#dpcBorder)" stroke-width="1.5"/>
</svg>
