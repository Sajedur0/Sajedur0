<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="icmTitle icmDesc">
  <title id="icmTitle">ICO Converter — Multi-Resolution Windows Icon Utility</title>
  <desc id="icmDesc">Lightweight desktop utility that transforms images into crisp, multi-resolution Windows .ico files with instant previews. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="icmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#111126"/>
    </linearGradient>

    <linearGradient id="icmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="icmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="icmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="icmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icmClip)">
    <rect width="300" height="300" fill="url(#icmBg)"/>
    <rect width="300" height="300" fill="url(#icmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#icmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#101E38" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="0,-13 12,8 -12,8" fill="none" stroke="#60A5FA" stroke-width="1.7" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </polygon>
      <circle r="3.5" fill="#67E8F9">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">ICO Converter</text>
      <text x="150" y="164" fill="#93C5FD" font-size="17.5" font-weight="600">Multi-size icon maker</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(61, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#16203B" stroke="#2D3F6E"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#93C5FD">Desktop</text>
        <rect x="103" y="0" width="75" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="140.5" y="23" text-anchor="middle" fill="#67E8F9">Icons</text>
      </g>
      <text x="150" y="272" fill="#93C5FD" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#icmBorder)" stroke-width="1.5"/>
</svg>
