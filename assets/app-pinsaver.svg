<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="psvTitle psvDesc">
  <title id="psvTitle">PinSaver Video Downloader — Google Play Android App</title>
  <desc id="psvDesc">Save publicly available Pinterest videos directly to your Android device for offline playback without an account.</desc>

  <defs>
    <linearGradient id="psvBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131126"/>
      <stop offset="100%" stop-color="#091422"/>
    </linearGradient>

    <linearGradient id="psvBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="psvBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="psvAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="psvClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#psvClip)">
    <rect width="580" height="214" fill="url(#psvBg)"/>
    <rect width="580" height="214" fill="url(#psvAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#psvBeam)">
      <animate attributeName="x" values="580;-240;580" dur="7.3s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#211630" stroke="#F9A8D4" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#F9A8D4" stroke-width="1.5" stroke-dasharray="14 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <path d="M 0 -7 V 4 M -5 0 L 0 5.5 L 5 0" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0,-1.5; 0,1.5; 0,-1.5" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <line x1="-6" y1="8.5" x2="6" y2="8.5" stroke="#F9A8D4" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#0C2824" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">GOOGLE PLAY</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">PinSaver <tspan fill="#F9A8D4" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#F9A8D4" font-size="13.5" font-weight="600">Fast Pinterest Video Downloader</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Download publicly shared Pinterest videos straight to local</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">phone storage for offline playback without signing in.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="96" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="48" y="18" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="106" y="0" width="98" height="28" rx="8" fill="#2B1626" stroke="#6D2E5B"/>
        <text x="155" y="18" text-anchor="middle" fill="#F9A8D4">Video Saver</text>
        <rect x="214" y="0" width="82" height="28" rx="8" fill="#16203B" stroke="#2D3F6E"/>
        <text x="255" y="18" text-anchor="middle" fill="#93C5FD">No Login</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#6EE7B7" font-size="12" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#psvBorder)" stroke-width="1.5"/>
</svg>
