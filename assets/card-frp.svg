<svg xmlns="http://www.w3.org/2000/svg" width="580" height="214" viewBox="0 0 580 214" fill="none" role="img" aria-labelledby="frpTitle frpDesc">
  <title id="frpTitle">FRP Bypass Center — Direct Android Recovery Utility Portal</title>
  <desc id="frpDesc">Searchable static download portal providing essential unlock utilities, launchers, and settings shortcuts for Android recovery.</desc>

  <defs>
    <linearGradient id="frpBg" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141322"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>

    <linearGradient id="frpBorder" x1="0" y1="0" x2="580" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="frpBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="frpAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frpClip">
      <rect x="1" y="1" width="578" height="212" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frpClip)">
    <rect width="580" height="214" fill="url(#frpBg)"/>
    <rect width="580" height="214" fill="url(#frpAura)"/>
    <rect x="-200" y="1" width="240" height="3" fill="url(#frpBeam)">
      <animate attributeName="x" values="-240;580;-240" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(46, 48)">
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#231E1E" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-10" y="-1" width="20" height="14" rx="4" fill="none" stroke="#34D399" stroke-width="1.7"/>
      <path d="M -5.5 -1 V -6.5 A 5.5 5.5 0 0 1 5.5 -6.5" fill="none" stroke="#FCD34D" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="2.4" fill="#FCD34D">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(410, 28)">
      <rect width="144" height="26" rx="13" fill="#241E18" stroke="#FCD34D" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#FCD34D">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FCD34D" letter-spacing="0.8">WEB PORTAL</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="82" y="45" fill="#F8FAFC" font-size="20.5" font-weight="800" letter-spacing="-0.4">FRP Bypass Center <tspan fill="#FCD34D" font-size="17">↗</tspan></text>
      <text x="82" y="67" fill="#FCD34D" font-size="13.5" font-weight="600">Direct download hub for Android recovery</text>
      <text x="26" y="106" fill="#CBD5E1" font-size="13.5">Fast, searchable web center offering essential Android recovery</text>
      <text x="26" y="128" fill="#94A8C4" font-size="13.5">utilities, launchers, and settings shortcuts with no login.</text>

      <g transform="translate(26, 158)" font-size="11.5" font-weight="700">
        <rect x="0" y="0" width="78" height="28" rx="8" fill="#2A1F14" stroke="#6B4C23"/>
        <text x="39" y="18" text-anchor="middle" fill="#FCD34D">Web Hub</text>
        <rect x="88" y="0" width="76" height="28" rx="8" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="126" y="18" text-anchor="middle" fill="#6EE7B7">Android</text>
        <rect x="174" y="0" width="80" height="28" rx="8" fill="#10253A" stroke="#234B6E"/>
        <text x="214" y="18" text-anchor="middle" fill="#67E8F9">No Login</text>
      </g>
      <text x="554" y="177" text-anchor="end" fill="#FCD34D" font-size="12" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="212" rx="18" stroke="url(#frpBorder)" stroke-width="1.5"/>
</svg>
