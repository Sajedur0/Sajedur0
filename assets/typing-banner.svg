<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" fill="none" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">Interactive Status Terminal — Sajedur Rahman Roni</title>
  <desc id="termDesc">Animated command bar cycling through software tools, web utilities, automation, and open source projects.</desc>

  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1200" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="50%" stop-color="#0C172E"/>
      <stop offset="100%" stop-color="#091022"/>
    </linearGradient>

    <linearGradient id="termStroke" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#A6A0EF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <clipPath id="termClip">
      <rect x="1" y="1" width="1198" height="62" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#termClip)">
    <rect x="1" y="1" width="1198" height="62" rx="14" fill="url(#termBg)"/>

    <!-- Left Prompt Badge -->
    <rect x="16" y="14" width="194" height="36" rx="9" fill="#0F1E38" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="34" cy="32" r="4" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="37" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#71DED2">~/sajedur0 <tspan fill="#A6A0EF">❯</tspan></text>

    <!-- Cycling Terminal Command Lines -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="600">
      <!-- Message 1 -->
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
        <text x="230" y="37" fill="#E2E8F0">
          <tspan fill="#C4B5FD">build_tools</tspan>(<tspan fill="#67E8F9">'Project Backup Tools'</tspan>, <tspan fill="#67E8F9">'Web Scrapers'</tspan>, <tspan fill="#67E8F9">'Utilities'</tspan>);
        </text>
      </g>

      <!-- Message 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
        <text x="230" y="37" fill="#E2E8F0">
          <tspan fill="#71DED2">automate_workflows</tspan>(stack: [<tspan fill="#86EFAC">'Python'</tspan>, <tspan fill="#86EFAC">'Rust'</tspan>, <tspan fill="#86EFAC">'TypeScript'</tspan>, <tspan fill="#86EFAC">'C++'</tspan>]);
        </text>
      </g>

      <!-- Message 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
        <text x="230" y="37" fill="#E2E8F0">
          <tspan fill="#93C5FD">craft_interfaces</tspan>(mindset: <tspan fill="#FDE68A">'Clean Architecture · Fast UX · Zero Friction'</tspan>);
        </text>
      </g>
    </g>

    <!-- Right Telemetry Indicator -->
    <g transform="translate(1036, 16)">
      <rect width="146" height="32" rx="8" fill="#0B192E" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="18" cy="16" r="3.5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1" letter-spacing="0.8">BUILD · PASSING</text>
    </g>

    <!-- Bottom Sweeping Progress Laser -->
    <rect x="0" y="61" width="1200" height="2" fill="#111C33"/>
    <rect x="0" y="61" width="360" height="2" fill="url(#progGrad)">
      <animate attributeName="x" values="-360;1200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="62" rx="14" stroke="url(#termStroke)" stroke-width="1.2"/>
</svg>
