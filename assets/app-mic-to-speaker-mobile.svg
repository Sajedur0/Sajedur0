<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="mtsmTitle mtsmDesc">
  <title id="mtsmTitle">Mic to Speaker — Google Play Android App</title>
  <desc id="mtsmDesc">Stream live microphone audio to Bluetooth, AUX, or USB speakers in the background with optional WAV recording. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="mtsmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081722"/>
      <stop offset="100%" stop-color="#0D1126"/>
    </linearGradient>

    <linearGradient id="mtsmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="mtsmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="mtsmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#71DED2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#71DED2" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="mtsmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mtsmClip)">
    <rect width="300" height="300" fill="url(#mtsmBg)"/>
    <rect width="300" height="300" fill="url(#mtsmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#mtsmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.0s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0E2532" stroke="#71DED2" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-4.5" y="-13" width="9" height="15" rx="4.5" fill="none" stroke="#71DED2" stroke-width="1.7"/>
      <path d="M -9.5 -3 A 9.5 9.5 0 0 0 9.5 -3" fill="none" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="6.5" x2="0" y2="12.5" stroke="#71DED2" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="-5" y1="12.5" x2="5" y2="12.5" stroke="#71DED2" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="0" cy="-5.5" r="2.2" fill="#34D399">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Mic to Speaker</text>
      <text x="150" y="164" fill="#71DED2" font-size="17.5" font-weight="600">Live audio &amp; recorder</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(43, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="129" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="64.5" y="23" text-anchor="middle" fill="#6EE7B7">Google Play</text>
        <rect x="139" y="0" width="75" height="34" rx="11" fill="#1E1B3A" stroke="#433878"/>
        <text x="176.5" y="23" text-anchor="middle" fill="#C4B5FD">Audio</text>
      </g>
      <text x="150" y="272" fill="#6EE7B7" font-size="15" font-weight="700">Google Play →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#mtsmBorder)" stroke-width="1.5"/>
</svg>
