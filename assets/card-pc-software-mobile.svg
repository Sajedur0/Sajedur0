<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="pcsmTitle pcsmDesc">
  <title id="pcsmTitle">PC Software Pack — Collection of Handy Windows Utilities</title>
  <desc id="pcsmDesc">Curated collection of everyday Windows helpers, printer utilities, Bengali fonts, context menu tools, and system cleaners. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="pcsmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131424"/>
      <stop offset="100%" stop-color="#091324"/>
    </linearGradient>

    <linearGradient id="pcsmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="pcsmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pcsmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pcsmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pcsmClip)">
    <rect width="300" height="300" fill="url(#pcsmBg)"/>
    <rect width="300" height="300" fill="url(#pcsmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#pcsmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#221E24" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-12" y="-6" width="24" height="17" rx="3.5" fill="none" stroke="#60A5FA" stroke-width="1.7"/>
      <path d="M -5 -6 V -9.5 C -5 -10.8 -4 -11.8 -2.7 -11.8 H 2.7 C 4 -11.8 5 -10.8 5 -9.5 V -6" fill="none" stroke="#60A5FA" stroke-width="1.6"/>
      <line x1="-12" y1="1.5" x2="12" y2="1.5" stroke="#60A5FA" stroke-width="1.4" opacity="0.7"/>
      <rect x="-2.5" y="-1" width="5" height="5" rx="1.2" fill="#FCD34D">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">PC Software</text>
      <text x="150" y="164" fill="#93C5FD" font-size="17.5" font-weight="600">Handy PC utilities</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(52, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#67E8F9">Windows</text>
        <rect x="103" y="0" width="93" height="34" rx="11" fill="#2A1F14" stroke="#6B4C23"/>
        <text x="149.5" y="23" text-anchor="middle" fill="#FCD34D">Toolkit</text>
      </g>
      <text x="150" y="272" fill="#FCD34D" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#pcsmBorder)" stroke-width="1.5"/>
</svg>
