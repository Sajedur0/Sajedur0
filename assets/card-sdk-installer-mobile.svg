<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="asimTitle asimDesc">
  <title id="asimTitle">Android SDK Installer — One-Click Windows Setup Utility</title>
  <desc id="asimDesc">Guided Windows setup tool that automatically installs Android command tools, system paths, and a ready-to-boot virtual phone. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="asimBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091526"/>
      <stop offset="100%" stop-color="#0B1124"/>
    </linearGradient>

    <linearGradient id="asimBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="asimBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="asimAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="asimClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#asimClip)">
    <rect width="300" height="300" fill="url(#asimBg)"/>
    <rect width="300" height="300" fill="url(#asimAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#asimBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.4s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0E2238" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="11" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="5 3.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="none" stroke="#67E8F9" stroke-width="1.8"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Android Setup</text>
      <text x="150" y="164" fill="#67E8F9" font-size="17.5" font-weight="600">Automated PC setup</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(47.5, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#67E8F9">Windows</text>
        <rect x="103" y="0" width="102" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="154" y="23" text-anchor="middle" fill="#6EE7B7">Emulator</text>
      </g>
      <text x="150" y="272" fill="#67E8F9" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#asimBorder)" stroke-width="1.5"/>
</svg>
