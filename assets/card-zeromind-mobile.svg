<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="zmmTitle zmmDesc">
  <title id="zmmTitle">ZeroMind — Cross-Platform Chat Application built with Flutter</title>
  <desc id="zmmDesc">A cross-platform chat application with dark mode, clean interface, and local-only data storage. Compact tile for small screens.</desc>

  <defs>
    <linearGradient id="zmmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#0D1025"/>
    </linearGradient>

    <linearGradient id="zmmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#A6A0EF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="zmmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#A6A0EF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="zmmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="zmmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#zmmClip)">
    <rect width="300" height="300" fill="url(#zmmBg)"/>
    <rect width="300" height="300" fill="url(#zmmAura)"/>

    <!-- Top Animated Shimmer Line -->
    <rect x="-160" y="1" width="160" height="4" fill="url(#zmmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated Geometric Core Icon -->
    <g transform="translate(150, 60)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0E223D" stroke="#00F2FE" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="13" fill="none" stroke="#00F2FE" stroke-width="1.4" stroke-dasharray="6 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#A6A0EF">
        <animate attributeName="r" values="4.5;7;4.5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-13" r="2.2" fill="#00F2FE"/>
      <circle cx="11" cy="7" r="2.2" fill="#71DED2"/>
      <circle cx="-11" cy="7" r="2.2" fill="#C4B5FD"/>
    </g>

    <!-- Tile Typography -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="132" fill="#F8FAFC" font-size="28" font-weight="800" letter-spacing="-0.5">ZeroMind</text>
      <text x="150" y="166" fill="#71DED2" font-size="18" font-weight="600">Cross-platform chat</text>

      <!-- Hairline Separator -->
      <path d="M 70 190 H 230" stroke="#1E2D45" stroke-width="1.2"/>

      <!-- Tech Stack Chips -->
      <g transform="translate(34, 206)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#67E8F9">Flutter</text>
        <rect x="103" y="0" width="129" height="34" rx="11" fill="#1E1B3A" stroke="#433878"/>
        <text x="167.5" y="23" text-anchor="middle" fill="#C4B5FD">Open Source</text>
      </g>

      <text x="150" y="274" fill="#71DED2" font-size="15" font-weight="700">View source →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#zmmBorder)" stroke-width="1.5"/>
</svg>
