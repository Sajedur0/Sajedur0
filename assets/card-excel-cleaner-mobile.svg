<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-labelledby="esrmTitle esrmDesc">
  <title id="esrmTitle">Excel Space Remover — Clean Unwanted Spaces in Spreadsheets</title>
  <desc id="esrmDesc">Web utility that finds, highlights, and removes unwanted leading and trailing spaces in Excel and CSV files. Compact tile for mobile screens.</desc>

  <defs>
    <linearGradient id="esrmBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081720"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="esrmBorder" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="esrmBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="esrmAura" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="esrmClip">
      <rect x="1" y="1" width="298" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#esrmClip)">
    <rect width="300" height="300" fill="url(#esrmBg)"/>
    <rect width="300" height="300" fill="url(#esrmAura)"/>
    <rect x="-160" y="1" width="160" height="4" fill="url(#esrmBeam)">
      <animate attributeName="x" values="-160;300;-160" dur="7.1s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150, 58)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#0D262B" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="-11" y="-11" width="9.5" height="9.5" rx="2.2" fill="none" stroke="#34D399" stroke-width="1.6"/>
      <rect x="1.5" y="-11" width="9.5" height="9.5" rx="2.2" fill="#34D399" fill-opacity="0.35" stroke="#34D399" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.2;0.75;0.2" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-11" y="1.5" width="9.5" height="9.5" rx="2.2" fill="none" stroke="#34D399" stroke-width="1.6"/>
      <rect x="1.5" y="1.5" width="9.5" height="9.5" rx="2.2" fill="none" stroke="#6EE7B7" stroke-width="1.6"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="130" fill="#F8FAFC" font-size="27" font-weight="800" letter-spacing="-0.5">Excel Cleaner</text>
      <text x="150" y="164" fill="#6EE7B7" font-size="17.5" font-weight="600">Spreadsheet cleaner</text>
      <path d="M 66 188 H 234" stroke="#1E2D45" stroke-width="1.2"/>
      <g transform="translate(61, 204)" font-size="15" font-weight="700">
        <rect x="0" y="0" width="93" height="34" rx="11" fill="#0C2924" stroke="#1B5E4A"/>
        <text x="46.5" y="23" text-anchor="middle" fill="#6EE7B7">Web App</text>
        <rect x="103" y="0" width="75" height="34" rx="11" fill="#10253A" stroke="#234B6E"/>
        <text x="140.5" y="23" text-anchor="middle" fill="#67E8F9">Excel</text>
      </g>
      <text x="150" y="272" fill="#6EE7B7" font-size="15" font-weight="700">Open Project →</text>
    </g>
  </g>

  <rect x="1" y="1" width="298" height="298" rx="18" stroke="url(#esrmBorder)" stroke-width="1.5"/>
</svg>
